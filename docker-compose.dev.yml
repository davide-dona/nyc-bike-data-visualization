# Development stack: pulls a prebuilt, preloaded database image and builds
# backend and frontend from source. No seeder service.
#
#   docker compose -f docker-compose.dev.yml up --build                  # small dataset (last 2 complete months)
#   DB_TAG=latest docker compose -f docker-compose.dev.yml up --build    # full dataset (~17 GB)
#
# The dump inside the image is restored only into an empty data directory, so
# each DB_TAG gets its own named volume. To pick up a refreshed :dev image,
# remove the volume first: docker compose -f docker-compose.dev.yml down -v
services:
  postgres:
    image: ghcr.io/446f6e6e79/nyc-bike-db:${DB_TAG:-dev}
    container_name: NYC-Bike-Dev-Postgres
    environment:
      POSTGRES_DB: citibike
      POSTGRES_USER: citibike
      POSTGRES_PASSWORD: citibike
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U citibike -d citibike -tAc \"SELECT 1 FROM information_schema.tables WHERE table_name='station_metadata'\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 720                                              # the :dev image is ready in ~1 min; first boot of :latest replays the full dump
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: dockers/Dockerfile.backend
    image: nyc-bike-backend:dev-local
    container_name: NYC-Bike-Dev-Backend
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://citibike:citibike@postgres:5432/citibike
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    stop_signal: SIGINT
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: dockers/Dockerfile.frontend
    image: nyc-bike-frontend:dev-local
    container_name: NYC-Bike-Dev-Frontend
    init: true
    depends_on:
      - backend
    ports:
      - "5173:5173"
    stop_signal: SIGINT
    stop_grace_period: 5s

volumes:
  app_data:
  pg_data_dev:
    name: nyc_bike_pg_${DB_TAG:-dev}                            # one volume per tag so switching dev<->latest restores the right dump
