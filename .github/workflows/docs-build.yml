name: Docs Build
# This workflow compiles the LaTeX documents in the docs directory whenever changes 
#are pushed to the main branch or when a pull request is opened targeting the main branch
#but only if the changes affect files in the docs directory or this workflow file itself.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
permissions:
  contents: write
  
jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # main is protected, so pushing the refreshed PDFs needs a token allowed to
        # bypass the pull request requirement. Pull request runs only compile, so
        # they fall back to the default token.
        with:
          token: ${{ secrets.DOCS_PDF_TOKEN || github.token }}

      - name: Compile proposal document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: proposal.tex
          working_directory: docs/proposal

      - name: Compile report document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: report.tex
          working_directory: docs/report

      - name: Compile technical report document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: technical-report.tex
          working_directory: docs/technical-report
      - name: Move compiled PDFs to docs directory
        run: |
          mv docs/proposal/proposal.pdf docs/proposal.pdf
          mv docs/report/report.pdf docs/report.pdf
          mv docs/technical-report/technical-report.pdf docs/technical-report.pdf
      
      # Only push runs update the committed PDFs: a pull request run is checked out
      # in detached HEAD on the merge commit, so it has no branch to push and its
      # PDFs describe a merge that may never happen.
      - name: Update PDF in repository
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/proposal.pdf
          git add docs/report.pdf
          git add docs/technical-report.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update compiled PDF documents"
          git push origin HEAD:main

