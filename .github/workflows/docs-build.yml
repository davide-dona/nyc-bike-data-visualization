name: Docs Build
# This workflow compiles the LaTeX documents in the docs directory whenever changes
#are pushed to the main branch or when a pull request is opened targeting the main branch
#but only if the changes affect files in the docs directory or this workflow file itself.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs-build.yml"
permissions:
  contents: write

concurrency:
  group: docs-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Compile proposal document
        uses: xu-cheng/latex-action@v3
        env:
          SOURCE_DATE_EPOCH: 1704067200
          FORCE_SOURCE_DATE: 1
        with:
          root_file: proposal.tex
          working_directory: docs/proposal

      - name: Compile report document
        uses: xu-cheng/latex-action@v3
        env:
          SOURCE_DATE_EPOCH: 1704067200
          FORCE_SOURCE_DATE: 1
        with:
          root_file: report.tex
          working_directory: docs/report

      - name: Compile technical report document
        uses: xu-cheng/latex-action@v3
        env:
          SOURCE_DATE_EPOCH: 1704067200
          FORCE_SOURCE_DATE: 1
        with:
          root_file: technical-report.tex
          working_directory: docs/technical-report

      - name: Move compiled PDFs to docs directory
        run: |
          mv docs/proposal/proposal.pdf docs/proposal.pdf
          mv docs/report/report.pdf docs/report.pdf
          mv docs/technical-report/technical-report.pdf docs/technical-report.pdf

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdfs
          path: docs/*.pdf
          retention-days: 30

      - name: Commit PDFs to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/proposal.pdf docs/report.pdf docs/technical-report.pdf
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update compiled PDF documents"
          git push origin HEAD:${{ github.head_ref }}
