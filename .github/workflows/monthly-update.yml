name: Monthly Data Update

# Incrementally seeds new data into the existing full db image and rebuilds the
# small dev db image (last 2 complete months), then updates the release title.
# Runs on the 5th of each month or can be triggered manually.
on:
  schedule:
    - cron: '0 0 5 * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nyc-bike

jobs:

  seed-full:                          # Pull existing db:latest, run incremental seeder, upload dump
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start existing db container
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=citibike \
            -e POSTGRES_USER=citibike \
            -e POSTGRES_PASSWORD=citibike \
            ${{ env.IMAGE_PREFIX }}-db:latest
          until docker exec pg pg_isready -U citibike -d citibike -h 127.0.0.1; do
            echo "Waiting for postgres..."; sleep 3
          done

      - name: Seed new data (incremental)
        timeout-minutes: 480
        run: |
          docker run --rm \
            --network container:pg \
            -e DATABASE_URL=postgresql://citibike:citibike@localhost:5432/citibike \
            -e PARALLEL_MONTHS=1 \
            -e DB_LOADER_WORKERS=2 \
            -e LOG_LEVEL=INFO \
            ${{ env.IMAGE_PREFIX }}-seeder:latest

      - name: Export database dump
        run: |
          docker exec pg pg_dump -U citibike --no-owner --no-privileges citibike \
            | gzip > citibike_data.sql.gz
          echo "Dump size: $(du -sh citibike_data.sql.gz | cut -f1)"

      - name: Stop and remove postgres container
        if: always()
        run: docker rm -f pg

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: citibike-dump
          path: citibike_data.sql.gz
          retention-days: 30

  build-full-image:                   # Build and push updated preloaded db:latest image
    needs: seed-full
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: citibike-dump

      - name: Build and push updated preloaded db image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/Dockerfile.db-preloaded
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  seed-dev:                           # Rebuild the small dev db image with the last 2 complete months
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute dev data window (last 2 complete months)
        id: window
        run: |
          START=$(date -u -d "$(date -u +%Y-%m-01) -2 months" +%Y%m)
          END=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y%m)
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "Dev data window: $START..$END"

      - name: Build unseeded base image
        run: docker build -f dockers/Dockerfile.postgres -t nyc-bike-db-unseeded:ci .

      - name: Start postgres container for seeding
        run: |
          docker run -d --name pg \
            -e POSTGRES_DB=citibike \
            -e POSTGRES_USER=citibike \
            -e POSTGRES_PASSWORD=citibike \
            nyc-bike-db-unseeded:ci
          until docker logs pg 2>&1 | grep -q "database system is ready to accept connections"; do
            echo "Waiting for postgres..."; sleep 2
          done

      - name: Seed dev dataset
        timeout-minutes: 60
        run: |
          docker run --rm \
            --network container:pg \
            -e DATABASE_URL=postgresql://citibike:citibike@localhost:5432/citibike \
            -e DATA_START_DATE=${{ steps.window.outputs.start }} \
            -e DATA_END_DATE=${{ steps.window.outputs.end }} \
            -e PARALLEL_MONTHS=1 \
            -e DB_LOADER_WORKERS=2 \
            -e LOG_LEVEL=INFO \
            ${{ env.IMAGE_PREFIX }}-seeder:latest

      - name: Export database dump
        run: |
          docker exec pg pg_dump -U citibike --no-owner --no-privileges citibike \
            | gzip > citibike_data_dev.sql.gz
          echo "Dump size: $(du -sh citibike_data_dev.sql.gz | cut -f1)"

      - name: Stop and remove postgres container
        if: always()
        run: docker rm -f pg

      - name: Build and push dev db image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockers/Dockerfile.db-preloaded
          build-args: |
            DUMP_FILE=citibike_data_dev.sql.gz
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-db:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-title:                       # Update the latest release title to reflect data coverage month
    needs: build-full-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update release title to previous month + year
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date +%Y)
          MONTH_NUM=$(date +%-m)
          if [ "$MONTH_NUM" -eq 1 ]; then
            DATA_MONTH="December"
            DATA_YEAR=$((YEAR - 1))
          else
            DATA_MONTH=$(date -d "$(date +%Y-%m-01) -1 month" +%B)
            DATA_YEAR=$YEAR
          fi
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q '.tagName')
          CURRENT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json name -q '.name')
          BASE=$(echo "$CURRENT" | sed 's/ - [A-Za-z]* [0-9]\{4\}$//' | sed 's/ - [A-Za-z]*$//')
          gh release edit "$TAG" --repo "${{ github.repository }}" --title "$BASE - $DATA_MONTH $DATA_YEAR"
          echo "Updated release $TAG title to: $BASE - $DATA_MONTH $DATA_YEAR"
